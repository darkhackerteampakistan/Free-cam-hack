<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis ID — Access Granted</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050914;
    --ink:#e6edf7;
    --muted:#7d8ea8;
    --teal:#14b8a6;
    --cyan:#06b6d4;
  }
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(800px 500px at 80% -10%, rgba(20,184,166,0.18), transparent 55%),
      radial-gradient(600px 400px at 10% 110%, rgba(139,92,246,0.14), transparent 55%),
      var(--bg);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .done-card{
    text-align:center;
    padding:52px 44px;
    border-radius:24px;
    border:1px solid rgba(148,163,184,0.12);
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
    backdrop-filter:blur(14px);
    box-shadow:0 40px 80px rgba(0,0,0,0.55);
    max-width:420px; width:92%;
  }
  .ring{
    width:96px; height:96px; margin:0 auto 22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--teal),var(--cyan));
    box-shadow:0 20px 50px rgba(20,184,166,0.45);
    color:#04121a;
    animation:pop .6s ease;
  }
  .ring svg{width:52px;height:52px;}
  @keyframes pop{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  h2{
    font-family:'Space Grotesk',sans-serif;
    margin:0 0 8px; font-size:24px; font-weight:700;
    letter-spacing:-0.5px;
  }
  p{ color:var(--muted); font-size:14px; margin:0; line-height:1.6; }
  .meta{
    margin-top:22px; padding-top:18px;
    border-top:1px solid rgba(148,163,184,0.10);
    font-family:'Space Grotesk',sans-serif;
    font-size:11.5px; color:var(--muted);
    letter-spacing:.4px;
  }
</style>
</head>
<body>
  <div class="done-card">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>You're verified</h2>
    <p>Identity confirmed. Redirecting you shortly…</p>
    <div class="meta">AEGIS ID · SECURE SESSION</div>
  </div>

  <script>
    setTimeout(function(){
      var d = new URLSearchParams(location.search).get("to");
      location.href = d || "https://www.google.com";
    }, 1800);
  </script>
</body>
</html>
